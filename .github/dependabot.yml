version: 2
updates:
  # Actions do GitHub (atualiza pins por SHA mantendo o comentario de versao)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - ci
    groups:
      actions:
        patterns:
          - '*'

  # Dependencias Python (pip-tools: atualiza requirements*.in)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - python
    ignore:
      - dependency-name: oracledb  # controlar manualmente por compatibilidade OCI
    groups:
      python-menores:
        update-types:
          - minor
          - patch

  # Dependencias Node.js (Dashboard: React/Vite/ESLint; lib: whatsapp-web.js; Receitas Bloqueadas: delega para lib)
  - package-ecosystem: npm
    directories:
      - /
      - '/Receitas Bloqueadas'
      - /Dashboard
      - /lib
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - nodejs
