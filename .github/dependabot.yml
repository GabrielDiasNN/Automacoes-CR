version: 2
updates:
  # Actions do GitHub (atualiza pins por SHA mantendo o comentario de versao)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - ci
    groups:
      actions:
        patterns:
          - '*'

  # Dependencias Python (pip-tools: atualiza requirements*.in)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - python
    groups:
      python-menores:
        update-types:
          - minor
          - patch

  # Dependencias Node.js (raiz: eslint do Dashboard; Receitas Bloqueadas: whatsapp-web.js)
  - package-ecosystem: npm
    directories:
      - /
      - '/Receitas Bloqueadas'
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencias
      - nodejs
