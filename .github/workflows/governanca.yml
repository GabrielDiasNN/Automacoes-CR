name: Governanca

permissions: {}

concurrency:
  group: governanca-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'Logs/**'
      - 'Backups/**'
  push:
    branches:
      - main
      - 'escalar/**'
    paths-ignore:
      - 'Logs/**'
      - 'Backups/**'

jobs:
  gitleaks:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  preparar-diff:
    name: Preparar diff
    # pwsh em ubuntu: Get-GovernanceTargetSummary.ps1 faz apenas git diff e
    # classificacao por regex (independente de plataforma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.changed-files.outputs.changed_files_json }}
      has_log_targets: ${{ steps.changed-files.outputs.has_log_targets }}
      has_python: ${{ steps.changed-files.outputs.has_python }}
      has_powershell: ${{ steps.changed-files.outputs.has_powershell }}
      has_js: ${{ steps.changed-files.outputs.has_js }}
      has_md: ${{ steps.changed-files.outputs.has_md }}
      log_target_count: ${{ steps.changed-files.outputs.log_target_count }}
      critical_path_count: ${{ steps.changed-files.outputs.critical_path_count }}
      selection_mode: ${{ steps.changed-files.outputs.selection_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Coletar arquivos alterados
        id: changed-files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $baseSha = ''
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseSha = '${{ github.event.pull_request.base.sha }}'
          }
          else {
            $baseSha = '${{ github.event.before }}'
          }

          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -eq '0000000000000000000000000000000000000000') {
            $changedFiles = @(git diff-tree --no-commit-id --name-only -r HEAD)
          }
          else {
            $changedFiles = @(git diff --name-only --diff-filter=ACMR $baseSha HEAD)
          }

          $changedFiles = @($changedFiles | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $summary = ./Tools/Get-GovernanceTargetSummary.ps1 -BasePath "${{ github.workspace }}" -Paths $changedFiles
          $changedFilesJson = if ($changedFiles.Count -gt 0) {
            ConvertTo-Json -InputObject @($changedFiles) -Compress
          }
          else {
            '[]'
          }

          $boolOut = { param($value) if ($value) { 'true' } else { 'false' } }

          "changed_files_json<<EOF" >> $env:GITHUB_OUTPUT
          $changedFilesJson >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "has_log_targets=$(& $boolOut $summary.HasLogTargets)" >> $env:GITHUB_OUTPUT
          "has_python=$(& $boolOut $summary.HasPython)" >> $env:GITHUB_OUTPUT
          "has_powershell=$(& $boolOut $summary.HasPowerShell)" >> $env:GITHUB_OUTPUT
          "has_js=$(& $boolOut $summary.HasJs)" >> $env:GITHUB_OUTPUT
          "has_md=$(& $boolOut $summary.HasMarkdown)" >> $env:GITHUB_OUTPUT
          "log_target_count=$($summary.LogTargetCount)" >> $env:GITHUB_OUTPUT
          "critical_path_count=$($summary.CriticalPathCount)" >> $env:GITHUB_OUTPUT
          "selection_mode=$($summary.SelectionMode)" >> $env:GITHUB_OUTPUT

          Write-Host ("Arquivos alterados detectados: " + $changedFiles.Count)
          Write-Host ("Modo de selecao governada: " + $summary.SelectionMode)
          Write-Host ("Caminhos criticos detectados: " + $summary.CriticalPathCount)
          Write-Host ("Alvos de conformidade de log: " + $summary.LogTargetCount)
          foreach ($file in $changedFiles) {
            Write-Host (" - " + $file)
          }

          @"
          ## Resumo da governanca por diff
          - Arquivos alterados: $($changedFiles.Count)
          - Modo de selecao: $($summary.SelectionMode)
          - Caminhos criticos: $($summary.CriticalPathCount)
          - Alvos de conformidade de log: $($summary.LogTargetCount)
          - Areas afetadas: Python=$(& $boolOut $summary.HasPython) PowerShell=$(& $boolOut $summary.HasPowerShell) JS=$(& $boolOut $summary.HasJs) Markdown=$(& $boolOut $summary.HasMarkdown)
          - `conformidade-log`: $(if ($summary.HasLogTargets) { 'executa' } else { 'pulado por falta de alvo elegivel' })
          "@ >> $env:GITHUB_STEP_SUMMARY

  lint-python:
    name: Lint Python
    # black/isort/bandit/pip-audit sao puro Python e independentes de SO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_python == 'true'
    permissions:
      contents: read
    env:
      CHANGED_FILES_JSON: ${{ needs.preparar-diff.outputs.changed_files_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Python (Dev)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Bloqueante (Ruff)
        shell: pwsh
        run: |
          python -m pip install ruff
          python -m ruff check Orchestrator/app Orchestrator/worker.py

      - name: Validar Estilo Python (Black & Isort)
        shell: pwsh
        run: |
          $changedFiles = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHANGED_FILES_JSON) -and $env:CHANGED_FILES_JSON -ne '[]') {
            $changedFiles = @($env:CHANGED_FILES_JSON | ConvertFrom-Json | Where-Object { $_ -match '\.py$' })
          }

          if ($changedFiles.Count -eq 0) {
            Write-Host "Nenhum arquivo Python alterado para validar com Black e Isort."
            exit 0
          }

          python -m black --check @changedFiles
          python -m isort --check-only @changedFiles

      - name: Analise Estatica de Seguranca (Bandit)
        shell: pwsh
        run: |
          python -m bandit -r Orchestrator/app Orchestrator/worker.py -ll

      - name: Auditoria de Dependencias (pip-audit)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt

  testes-python:
    name: Testes Python
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_python == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Python (Runtime & Test)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Executar Testes Unitarios Python (Pytest)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PYTHONPATH="Orchestrator"
          # Gate de regressao: cobertura medida em 03/07/2026 (Fase 2 do plano
          # de QA) era 83%; o gate fica em 82% para dar margem a flutuacoes de
          # plataforma. Escalonamento: 77% (Fase 1) -> 82% (Fase 2) -> 90% (Fase 3).
          pytest "Orchestrator\tests" -v -m "not e2e" `
            --cov=app --cov=worker `
            --cov-report=xml:coverage.xml --cov-report=term `
            --cov-fail-under=82 `
            --junitxml=junit-unit.xml

      - name: Publicar resumo de cobertura
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'coverage.xml')) {
            Write-Host 'coverage.xml nao gerado; resumo de cobertura pulado.'
            exit 0
          }

          [xml]$cov = Get-Content 'coverage.xml'
          $pctTotal = [math]::Round([double]$cov.coverage.'line-rate' * 100, 1)

          $linhas = @()
          foreach ($pacote in $cov.coverage.packages.package) {
            $pct = [math]::Round([double]$pacote.'line-rate' * 100, 1)
            $linhas += "| $($pacote.name) | $pct% |"
          }

          @"
          ## Cobertura de testes Python

          - Total: **$pctTotal%** (gate de regressao: 82%)

          | Pacote | Cobertura |
          |--------|-----------|
          $($linhas -join "`n")
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorios-testes-python-${{ github.run_number }}
          path: |
            junit-unit.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn

  testes-e2e:
    name: Testes E2E
    runs-on: windows-latest
    timeout-minutes: 20
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_python == 'true' || needs.preparar-diff.outputs.has_js == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Python (Runtime & Test)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Configurar Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Instalar dependencias do Dashboard (lockfile)
        run: npm ci
        working-directory: Dashboard

      - name: Build do Dashboard React (tsc + vite)
        run: npm run build
        working-directory: Dashboard

      - name: Cache Browsers Playwright
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-test.txt') }}

      - name: Instalar Browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m playwright install chromium

      - name: Executar Testes E2E Playwright (Headless)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PYTHONPATH="Orchestrator"
          pytest "Orchestrator\tests\test_e2e_dashboard.py" -v -m e2e --basetemp="Orchestrator\tests\e2e-evidence" --junitxml=junit-e2e.xml

      - name: Publicar Evidencias E2E
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence-${{ github.run_number }}
          path: |
            Orchestrator/tests/e2e-evidence/**
            junit-e2e.xml
          retention-days: 14
          if-no-files-found: warn

  governanca-agregada:
    name: Governanca agregada
    runs-on: windows-latest
    timeout-minutes: 20
    needs: preparar-diff
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Python (Dev & Test)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Test e necessario alem de Dev: o Mypy verifica Orchestrator/tests,
          # que importa pytest, httpx e playwright.
          python -m pip install -r requirements-dev.txt -r requirements-test.txt

      - name: Validar governanca agregada (orquestrador soberano)
        shell: pwsh
        run: |
          # -OnlyGovernance: sem o switch o orquestrador tambem roda pytest/E2E,
          # que ja possuem jobs dedicados (testes-python, testes-e2e).
          ./Tools/ValidarAutomacoes.ps1 -BasePath "${{ github.workspace }}" -OnlyGovernance

      - name: Validar atualizacao do CHANGELOG (somente PR)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          CHANGED_FILES_JSON: ${{ needs.preparar-diff.outputs.changed_files_json }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $changedFiles = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHANGED_FILES_JSON) -and $env:CHANGED_FILES_JSON -ne '[]') {
            $changedFiles = @($env:CHANGED_FILES_JSON | ConvertFrom-Json)
          }

          $allowSkip = $env:PR_TITLE -match '\[skip-changelog\]'
          ./Tools/Test-ChangelogUpdated.ps1 -Paths $changedFiles -AllowSkip:$allowSkip

  testes-powershell:
    name: Testes PowerShell (Pester)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_powershell == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Modulos PowerShell (Pester)
        id: pester-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester-5.7.1

      - name: Instalar Pester
        if: steps.pester-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Executar Testes Unitarios PowerShell (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester -Path "${{ github.workspace }}\lib\tests" -CI

      - name: Publicar resultados Pester
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorios-testes-pester-${{ github.run_number }}
          path: testResults.xml
          retention-days: 14
          if-no-files-found: warn

  conformidade-log:
    name: Conformidade de log
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_log_targets == 'true'
    permissions:
      contents: read
    env:
      CHANGED_FILES_JSON: ${{ needs.preparar-diff.outputs.changed_files_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validar conformidade de log nos arquivos alterados
        shell: pwsh
        run: |
          $changedFiles = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHANGED_FILES_JSON) -and $env:CHANGED_FILES_JSON -ne '[]') {
            $changedFiles = @($env:CHANGED_FILES_JSON | ConvertFrom-Json)
          }

          Write-Host ("Alvos elegiveis recebidos do diff: " + $changedFiles.Count)
          ./Tools/Test-LogConformidade.ps1 -RootPath "${{ github.workspace }}" -Paths $changedFiles

  frontend:
    name: Qualidade Frontend (Dashboard React)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_js == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Testes Unitarios (Vitest)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  markdown:
    name: Markdown
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_md == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validar markdown em dry run
        shell: pwsh
        run: |
          ./Tools/Fix-MarkdownStyle.ps1 -DryRun

  resumo-final:
    name: Resumo final
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - gitleaks
      - preparar-diff
      - lint-python
      - testes-python
      - testes-e2e
      - governanca-agregada
      - testes-powershell
      - conformidade-log
      - frontend
      - markdown
    permissions: {}
    env:
      RESULTADOS_JSON: ${{ toJSON(needs) }}

    steps:
      - name: Consolidar resultados da governanca
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rotulos = [ordered]@{
            'gitleaks'            = 'Gitleaks Security Scan'
            'preparar-diff'       = 'Preparar diff'
            'lint-python'         = 'Lint Python'
            'testes-python'       = 'Testes Python'
            'testes-e2e'          = 'Testes E2E'
            'governanca-agregada' = 'Governanca agregada'
            'testes-powershell'   = 'Testes PowerShell (Pester)'
            'conformidade-log'    = 'Conformidade de log'
            'frontend'            = 'Lint JavaScript (Dashboard)'
            'markdown'            = 'Markdown'
          }

          $resultados = $env:RESULTADOS_JSON | ConvertFrom-Json
          $falhas = @()
          $linhas = @()

          foreach ($job in $rotulos.Keys) {
            $resultado = $resultados.$job.result
            $icone = switch ($resultado) {
              'success'   { 'OK' }
              'skipped'   { 'PULADO' }
              'failure'   { 'FALHOU' }
              'cancelled' { 'CANCELADO' }
              default     { $resultado }
            }

            if ($resultado -in @('failure', 'cancelled')) {
              $falhas += $rotulos[$job]
            }

            $linhas += "| $($rotulos[$job]) | $icone |"
          }

          $status = if ($falhas.Count -eq 0) { 'PASSOU' } else { 'FALHOU' }
          @"
          ## $status — Governanca

          | Campo | Valor |
          |-------|-------|
          | Commit | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | Branch | ``${{ github.ref_name }}`` |
          | Autor | ${{ github.actor }} |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ### Resultado por job
          | Job | Resultado |
          |-----|-----------|
          $($linhas -join "`n")
          "@ >> $env:GITHUB_STEP_SUMMARY

          if ($falhas.Count -gt 0) {
            Write-Host ("Jobs com falha: " + ($falhas -join ', '))
            exit 1
          }

          Write-Host "Todos os jobs obrigatorios concluiram com sucesso."
