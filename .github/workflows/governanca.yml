name: Governanca

permissions: {}

concurrency:
  group: governanca-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/skills/**'
      - '.githooks/pre-commit'
      - 'Tools/**'
      - 'README.md'
      - '**/*.md'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.py'
      - '**/*.js'
      - '**/*.json'
      - '**/*.sql'
      - '**/*.txt'
      - '**/*.html'
      - '**/*.css'
  push:
    branches:
      - main
      - 'escalar/**'
    paths:
      - '.github/workflows/**'
      - '.github/skills/**'
      - '.githooks/pre-commit'
      - 'Tools/**'
      - 'README.md'
      - '**/*.md'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.py'
      - '**/*.js'
      - '**/*.json'
      - '**/*.sql'
      - '**/*.txt'
      - '**/*.html'
      - '**/*.css'

jobs:
  gitleaks:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  preparar-diff:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.changed-files.outputs.changed_files_json }}
      has_log_targets: ${{ steps.changed-files.outputs.has_log_targets }}
      log_target_count: ${{ steps.changed-files.outputs.log_target_count }}
      critical_path_count: ${{ steps.changed-files.outputs.critical_path_count }}
      selection_mode: ${{ steps.changed-files.outputs.selection_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Coletar arquivos alterados
        id: changed-files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $baseSha = ''
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseSha = '${{ github.event.pull_request.base.sha }}'
          }
          else {
            $baseSha = '${{ github.event.before }}'
          }

          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -eq '0000000000000000000000000000000000000000') {
            $changedFiles = @(git diff-tree --no-commit-id --name-only -r HEAD)
          }
          else {
            $changedFiles = @(git diff --name-only --diff-filter=ACMR $baseSha HEAD)
          }

          $changedFiles = @($changedFiles | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $summary = ./Tools/Get-GovernanceTargetSummary.ps1 -BasePath "${{ github.workspace }}" -Paths $changedFiles
          $changedFilesJson = if ($changedFiles.Count -gt 0) {
            ConvertTo-Json -InputObject @($changedFiles) -Compress
          }
          else {
            '[]'
          }

          $hasLogTargets = if ($summary.HasLogTargets) { 'true' } else { 'false' }

          "changed_files_json<<EOF" >> $env:GITHUB_OUTPUT
          $changedFilesJson >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          "has_log_targets=$hasLogTargets" >> $env:GITHUB_OUTPUT
          "log_target_count=$($summary.LogTargetCount)" >> $env:GITHUB_OUTPUT
          "critical_path_count=$($summary.CriticalPathCount)" >> $env:GITHUB_OUTPUT
          "selection_mode=$($summary.SelectionMode)" >> $env:GITHUB_OUTPUT

          Write-Host ("Arquivos alterados detectados: " + $changedFiles.Count)
          Write-Host ("Modo de selecao governada: " + $summary.SelectionMode)
          Write-Host ("Caminhos criticos detectados: " + $summary.CriticalPathCount)
          Write-Host ("Alvos de conformidade de log: " + $summary.LogTargetCount)
          foreach ($file in $changedFiles) {
            Write-Host (" - " + $file)
          }

          if ($summary.HasLogTargets) {
            Write-Host "Job conformidade-log: EXECUTAR"
          }
          else {
            Write-Host "Job conformidade-log: PULAR (sem scripts PowerShell operacionais elegiveis no diff)"
          }

          @"
          ## Resumo da governanca por diff
          - Arquivos alterados: $($changedFiles.Count)
          - Modo de selecao: $($summary.SelectionMode)
          - Caminhos criticos: $($summary.CriticalPathCount)
          - Alvos de conformidade de log: $($summary.LogTargetCount)
          - `conformidade-log`: $(if ($summary.HasLogTargets) { 'executa' } else { 'pulado por falta de alvo elegivel' })
          "@ >> $env:GITHUB_STEP_SUMMARY

  governanca:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: preparar-diff
    permissions:
      contents: read
    env:
      CHANGED_FILES_JSON: ${{ needs.preparar-diff.outputs.changed_files_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Python (Runtime, Dev & Test)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-test.txt

      - name: Cache Browsers Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-test.txt') }}

      - name: Instalar Browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m playwright install chromium

      - name: Validar Estilo Python (Black & Isort)
        shell: pwsh
        run: |
          $changedFiles = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHANGED_FILES_JSON) -and $env:CHANGED_FILES_JSON -ne '[]') {
            $changedFiles = @($env:CHANGED_FILES_JSON | ConvertFrom-Json | Where-Object { $_ -match '\.py$' })
          }

          if ($changedFiles.Count -eq 0) {
            Write-Host "Nenhum arquivo Python alterado para validar com Black e Isort."
            exit 0
          }

          python -m black --check @changedFiles
          python -m isort --check-only @changedFiles

      - name: Validar governanca de SKILLs
        shell: pwsh
        run: |
          ./Tools/Test-SkillsGovernance.ps1 -BasePath "${{ github.workspace }}"

      - name: Validar governanca agregada
        shell: pwsh
        run: |
          ./Tools/ValidarAutomacoes.ps1 -BasePath "${{ github.workspace }}"

      - name: Validar encoding de fontes e documentacao
        shell: pwsh
        run: |
          ./Tools/Test-SourceEncoding.ps1 -RootPath "${{ github.workspace }}"

      - name: Validar Seguranca Zero Trust
        shell: pwsh
        run: |
          ./Tools/Test-ZeroTrust.ps1 -RootPath "${{ github.workspace }}"

      - name: Validar Python (Mypy & Pylint)
        shell: pwsh
        run: |
          ./Tools/Test-PythonGovernance.ps1 -RootPath "${{ github.workspace }}"

      - name: Analise Estatica de Seguranca (Bandit)
        shell: pwsh
        run: |
          python -m bandit -r Orchestrator/app Orchestrator/worker.py -ll

      - name: Auditoria de Dependencias (pip-audit)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt

      - name: Executar Testes Unitarios Python (Pytest)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PYTHONPATH="Orchestrator"
          pytest "Orchestrator\tests" -v -m "not e2e"

      - name: Executar Testes E2E Playwright (Headless)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PYTHONPATH="Orchestrator"
          pytest "Orchestrator\tests\test_e2e_dashboard.py" -v -m e2e --basetemp="Orchestrator\tests\e2e-evidence"

      - name: Publicar Evidencias E2E
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence-${{ github.run_number }}
          path: Orchestrator/tests/e2e-evidence/**
          retention-days: 14
          if-no-files-found: warn

      - name: Validar Performance SQL (Oracle)
        shell: pwsh
        run: |
          ./Tools/Test-SqlPerformance.ps1 -RootPath "${{ github.workspace }}"

      - name: Validar PowerShell (Analyzer & Try/Catch)
        shell: pwsh
        run: |
          ./Tools/Test-PowerShellGovernance.ps1 -RootPath "${{ github.workspace }}"

      - name: Cache Modulos PowerShell (Pester)
        id: pester-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester-5.7.1

      - name: Instalar Pester
        if: steps.pester-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Executar Testes Unitarios PowerShell (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester -Path "${{ github.workspace }}\lib\tests" -CI

      - name: Validar Portabilidade (Sem Caminhos Absolutos)
        shell: pwsh
        run: |
          ./Tools/Test-PortablePaths.ps1 -RootPath "${{ github.workspace }}"

      - name: Resumo final da governanca
        if: always()
        shell: pwsh
        run: |
          $status = if (${{ job.status }} -eq 'success') { '✅ PASSOU' } else { '❌ FALHOU' }
          @"
          ## $status — Governanca

          | Campo | Valor |
          |-------|-------|
          | Commit | [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | Branch | ``${{ github.ref_name }}`` |
          | Autor | ${{ github.actor }} |
          | Executado em | ${{ runner.os }} |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ### Checklist de validacoes
          - Estilo Python (Black & Isort)
          - Governanca de SKILLs
          - Governanca agregada
          - Encoding de fontes
          - Seguranca Zero Trust
          - Python (Mypy & Pylint)
          - Analise de Seguranca (Bandit)
          - Auditoria de Dependencias (pip-audit)
          - Testes Unitarios Python (Pytest)
          - Testes E2E Playwright
          - Performance SQL (Oracle)
          - PowerShell (Analyzer & Try/Catch)
          - Testes Unitarios PowerShell (Pester)
          - Portabilidade (Sem Caminhos Absolutos)
          "@ >> $env:GITHUB_STEP_SUMMARY

  conformidade-log:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    if: needs.preparar-diff.outputs.has_log_targets == 'true'
    permissions:
      contents: read
    env:
      CHANGED_FILES_JSON: ${{ needs.preparar-diff.outputs.changed_files_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validar conformidade de log nos arquivos alterados
        shell: pwsh
        run: |
          $changedFiles = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHANGED_FILES_JSON) -and $env:CHANGED_FILES_JSON -ne '[]') {
            $changedFiles = @($env:CHANGED_FILES_JSON | ConvertFrom-Json)
          }

          Write-Host ("Alvos elegiveis recebidos do diff: " + $changedFiles.Count)
          ./Tools/Test-LogConformidade.ps1 -RootPath "${{ github.workspace }}" -Paths $changedFiles

  eslint:
    name: Lint JavaScript (Dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: ESLint
        run: npx --yes eslint@9 "Dashboard/js/**/*.js"

  markdown:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: preparar-diff
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validar markdown em dry run
        shell: pwsh
        run: |
          ./Tools/Fix-MarkdownStyle.ps1 -DryRun
