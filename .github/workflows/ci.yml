name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  static-analysis:
    name: Análise Estática (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff mypy types-requests
      - run: ruff check Orchestrator/app/ Orchestrator/worker.py
      - run: mypy Orchestrator/app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # baseline: apenas reportar, não bloquear ainda

  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Executar pytest
        run: |
          cd Orchestrator
          pytest tests/ -v --tb=short --junitxml=../test-results.xml \
            --cov=app --cov-report=xml:../coverage.xml \
            --ignore=tests/e2e
        env:
          PYTHONUTF8: "1"
          ORCHESTRATOR_DB_PATH: ":memory:"
          PYTHONPATH: "."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  secret-scan:
    name: Varredura de Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  js-quality:
    name: Qualidade Frontend (Dashboard React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
