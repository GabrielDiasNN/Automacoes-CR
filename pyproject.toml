[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B904", "B008"]

[tool.ruff.lint.per-file-ignores]
"Orchestrator/worker.py" = ["B006", "B008"]
"Orchestrator/app/notifications.py" = ["B006"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
# Módulos críticos excluídos do mypy gradualmente (remover um a um nas fases seguintes)
exclude = [
    "Orchestrator/app/notifications\\.py",
    "Orchestrator/app/database\\.py",
    "Orchestrator/app/models\\.py",
    "Orchestrator/worker\\.py",
]
