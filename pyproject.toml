[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
# Declarado explicitamente porque `profile = "black"` NÃO o implica: sem esta
# linha o isort quebra `from X import (a as a, b as b)` em um statement por
# nome e o ruff (com `combine-as-imports = true`) desfaz, cada gate reprovando
# o resultado do outro nos módulos de reexportação.
combine_as_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B904", "B008"]

[tool.ruff.lint.isort]
# O isort roda com `profile = "black"`, que implica `combine_as_imports = True`;
# o padrão do ruff é o oposto e quebrava cada `from X import (a as a, b as b)`
# em um statement por nome. Sem este alinhamento, os dois gates se desfazem
# mutuamente nos módulos de reexportação (`contracts/_queries.py`).
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"Orchestrator/worker.py" = ["B006", "B008"]
"Orchestrator/app/notifications.py" = ["B006"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
# Sem exclusões: os quatro módulos críticos (notifications, database, models, worker)
# que ficavam de fora passaram a compilar limpos em `mypy --strict` e foram
# reintegrados na revisão arquitetural (achado A8). Não reintroduzir exclusão aqui
# sem registrar a justificativa e um prazo de saída.
