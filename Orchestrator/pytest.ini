[pytest]
# -m "not e2e": alinha o padrao local ao CI, que ja roda a suite unitaria com
# essa exclusao (job `testes-python`) e reserva os E2E para o job dedicado.
# Sem isto, `pytest` sem argumentos — o comando documentado no CLAUDE.md — puxa
# os 11 testes Playwright para dentro da suite, e com eles duas fixtures de
# ESCOPO DE SESSAO que sobem um Uvicorn em subprocesso e o Chromium. O teardown
# dessas fixtures roda no fim da sessao e o pytest o atribui ao ULTIMO teste
# coletado, hoje `test_worker_wakeup_unit.py::test_log_flusher_nao_envia_buffer_vazio`:
# qualquer falha ao encerrar esses processos externos (comum no Windows sob
# carga) aparecia como erro de teardown num teste sem relacao alguma com eles.
# Os E2E continuam obrigatorios — rode-os com `pytest -m e2e`, que sobrescreve
# esta opcao, exatamente como o CI faz.
addopts = -p no:cacheprovider --strict-markers -m "not e2e"
# pythonpath = .: sem isto, `..\.venv\Scripts\pytest` — o comando documentado no
# CLAUDE.md, no runbook de recuperacao e nas skills locais — falha no import do
# `conftest.py` com `ModuleNotFoundError: No module named 'app'` (exit 4), porque
# o console script nao coloca o cwd em `sys.path`. So funcionavam os caminhos que
# exportam PYTHONPATH por fora (CI e `Test-OrchestratorIntegrity.ps1`) ou
# `python -m pytest`. Declarar aqui torna o comando documentado verdadeiro e
# mantem os dois caminhos existentes funcionando (o PYTHONPATH externo vira
# redundante, nao conflitante).
pythonpath = .
testpaths = tests
python_files = test_*.py
markers =
    unitario: testes unitários isolados (sem I/O externo)
    integracao: testes de integração com banco SQLite em memória
    e2e: testes Playwright fim-a-fim (requerem servidor ativo)
    benchmark: testes de performance (pytest-benchmark, não bloqueante no CI)
